<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>

    <meta name="description"
      content="Contact White Water Rafting for questions, reservations, and feedback.">
    <meta name="author" content="Chinonso Echefu">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <!-- Header -->
    <header>
        <img src="images/logo.png" alt="White Water Rafting company logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main -->
    <main>

        <!-- Contact Info -->
        <section class="contact-info">
            <h1>Contact Us</h1>

            <p><strong>Address:</strong> 123 River Road, Adventure City</p>
            <p><strong>Phone:</strong> +234 800 123 4567</p>
            <p><strong>Email:</strong> info@wwr.com</p>

            <!-- FIXED GOOGLE MAP -->
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.019484984019!2d-122.4194!3d37.7749!2m3!1f0!2f0!3f0!"
              width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy">
            </iframe>
        </section>

        <!-- Employees -->
        <section class="employees">
            <h2>Our Team</h2>

            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jfif"
                      alt="John, General Manager at White Water Rafting">
                    <figcaption>John – General Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jfif"
                      alt="Sarah, Senior Raft Guide leading river tours">
                    <figcaption>Sarah – Senior Raft Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jfif"
                      alt="Mike, Customer Support representative assisting clients">
                    <figcaption>Mike – Customer Support</figcaption>
                </figure>
            </div>
        </section>

        <!-- Contact Form -->
        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <!-- FIXED RADIO GROUP -->
                <fieldset>
                    <legend>Purpose of Message:</legend>

                    <input type="radio" id="general" name="purpose" value="general" required>
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>

                <div class="checkbox">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Send Message</button>

            </form>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 White Water Rafting – Chinonso Echefu</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram icon">
            </a>
        </nav>
    </footer>

</body>

</html>
